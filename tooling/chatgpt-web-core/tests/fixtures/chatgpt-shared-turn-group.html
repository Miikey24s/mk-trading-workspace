<div id="turn" data-turn-key="synthetic-turn">
  <div data-content-search-turn-key="fallback-turn-0">
    <div class="flex flex-col gap-1.5">
      <div class="group flex flex-col" data-talvt-turn-state="complete">
        <div class="flex flex-col gap-3 browser:gap-1">
          <div class="block-build-hash">
            <h4 class="sr-only">You said:</h4>
            <div class="group/user-message"><div data-user-message-bubble="true">
              <div>PRIVATE INSTRUCTIONS must never be delivered</div>
              <button aria-label="Copy"></button>
            </div></div>
          </div>
          <div class="block-build-hash">
            <span hidden data-chatgpt-agent-turn-start></span>
            <div><h4 class="sr-only" data-conversation-role="assistant" tabindex="-1">ChatGPT said:</h4>
              <div><p>REPLAY READY</p></div>
            </div>
          </div>
        </div>
        <div class="turn-action-controls"><button aria-label="Copy"></button><button aria-label="Read aloud"></button></div>
      </div>
    </div>
  </div>
</div>
