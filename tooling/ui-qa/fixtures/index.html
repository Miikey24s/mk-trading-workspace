<!doctype html>
<html lang="vi">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>UI QA fixture — không phải sản phẩm</title>
<style>
  * { box-sizing: border-box; } body { margin: 0; padding: 24px; font: 16px system-ui; color: #142032; background: #f5f7fa; }
  main { max-width: 760px; margin: auto; } h1 { font-size: 26px; } form { display: grid; gap: 12px; }
  input, button { font: inherit; padding: 12px; width: 100%; } button { background: #173e77; color: white; border: 0; }
  [role="alert"] { color: #942000; } canvas { width: 100%; height: 160px; display: block; }
</style>
<main>
  <h1>Kiểm tra công cụ UI</h1>
  <p data-testid="scope">FIXTURE GIẢ — không giao dịch, không kiểm chứng Prop session sản phẩm.</p>
  <form novalidate>
    <label for="name">Tên phiên thử công cụ</label><input id="name" autocomplete="off">
    <button type="submit">Lưu bản thử</button>
  </form>
  <p role="alert" hidden></p><p role="status"></p>
  <canvas aria-label="Minh họa canvas fixture" width="760" height="160"></canvas>
</main>
<script>
  const nameInput = document.querySelector('input');
  const status = document.querySelector('[role=status]');
  const alert = document.querySelector('[role=alert]');
  const key = 'tw-tooling-fixture-name';
  const restore = () => { const value = localStorage.getItem(key); status.textContent = value ? 'Đã lưu: ' + value : 'Chưa có dữ liệu'; };
  restore();
  document.querySelector('form').addEventListener('submit', event => {
    event.preventDefault();
    if (!nameInput.value.trim()) { alert.hidden = false; alert.textContent = 'Cần nhập tên phiên.'; return; }
    alert.hidden = true; localStorage.setItem(key, nameInput.value.trim()); restore();
  });
  const ctx = document.querySelector('canvas').getContext('2d');
  ctx.fillStyle = '#e3eafa'; ctx.fillRect(0, 0, 760, 160);
  ctx.strokeStyle = '#173e77'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(20, 120); ctx.lineTo(220, 90); ctx.lineTo(420, 105); ctx.lineTo(740, 30); ctx.stroke();
</script>
</html>
