<textArea id="m3458764683595937994" data-miro-id="3458764683595937994" x="60" y="135" width="1320" height="70" fill="#344256" font-family="noto_sans" font-size="25" text-align="left">Mục tiêu: hiểu phương pháp → kiểm chứng lợi thế → luyện thực thi → đánh giá khả năng payout quỹ.&lt;br /&gt;Trading và phần mềm phát triển song song; không coi một backtest đẹp là bằng chứng kiếm tiền.</textArea>
<rect id="m3458764683595937995" data-miro-id="3458764683595937995" x="60" y="290" width="660" height="170" data-content="ĐANG TẬP TRUNG&lt;br /&gt;Hiểu gốc phương pháp: trend và mean reversion.&lt;br /&gt;Chưa chọn chiến lược chủ lực; tạm dừng tối ưu." fill="#fff6b6" data-text-color="#1a1a1a" data-font-size="25" stroke="#af7e02" />
